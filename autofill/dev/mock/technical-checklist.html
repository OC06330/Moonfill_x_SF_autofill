<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mock Implementation · Technical Checklist</title>
<style>
  body { margin: 0; background: #f3f3f3; color: #181818; font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  .banner { background: #fef1d7; border-bottom: 1px solid #e4c06e; padding: 10px 24px; }
  .banner select { margin-left: 8px; }
  header.record { background: #fff; padding: 16px 24px; border-bottom: 1px solid #ddd; }
  header.record small { color: #666; text-transform: uppercase; letter-spacing: .06em; }
  header.record h1 { margin: 2px 0 0; font-size: 20px; }
  main { max-width: 1000px; margin: 16px auto 96px; padding: 0 16px; display: grid; gap: 16px; }
  section { background: #fff; border: 1px solid #ddd; border-radius: 6px; padding: 12px 16px; }
  section h3 { display: inline-block; margin: 4px 0 12px; font-size: 16px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 4px 24px; }
  .field-row { border-bottom: 1px solid #eee; padding: 6px 0; display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 4px; }
  .field-label { grid-column: 1 / -1; color: #555; font-size: 12px; }
  .field-value { min-height: 20px; }
  .field-row select, .field-row input[type=text], .field-row textarea { grid-column: 1 / -1; width: 100%; box-sizing: border-box; font: inherit; padding: 4px; }
  button[title^="Edit "] { border: 0; background: none; color: #888; cursor: pointer; }
  footer.edit-bar { position: fixed; left: 0; right: 0; bottom: 0; background: #fff; border-top: 1px solid #ccc; padding: 12px; display: flex; justify-content: center; gap: 8px; }
  footer.edit-bar button { padding: 6px 16px; }
  .save-error { color: #ba0517; font-weight: 600; align-self: center; }
  .toast-success { position: fixed; top: 16px; left: 50%; transform: translateX(-50%); background: #2e844a; color: #fff; padding: 10px 18px; border-radius: 4px; }
</style>
</head>
<body>
<div class="banner">
  <strong>Mock page — not Salesforce.</strong> Fictional record; layout and dropdown options are illustrative.
  <label>Scenario
    <select id="scenario">
      <option value="success">Successful save</option>
      <option value="error">Save validation error</option>
      <option value="missing-option">Dropdown option missing</option>
      <option value="duplicate">Two Technical Checklists</option>
      <option value="no-history">No "Created." line in history</option>
      <option value="dates-filled">Date fields already filled</option>
      <option value="no-landing">No Landing Page URL</option>
    </select>
  </label>
</div>
<header class="record"><small>Implementation</small><h1>IMP-0001 · Example Retailer Ltd</h1></header>
<main id="main"></main>
<div id="footer"></div>
<div id="toast"></div>

<script src="../../fields.js"></script>
<script>
(function () {
  const spec = globalThis.TCA_FIELDS;
  const scenarioSelect = document.getElementById('scenario');
  const fromQuery = new URLSearchParams(location.search).get('scenario');
  if (fromQuery) scenarioSelect.value = fromQuery;
  scenarioSelect.addEventListener('change', () => { location.search = '?scenario=' + scenarioSelect.value; });
  const scenario = scenarioSelect.value;

  const TEXT = new Set(['Deduplication Parameter', 'Channel parameters implemented', 'Website Platform URL', 'Other eCommerce platform',
    'Other Deduplication Solution', 'MT plugins activated', 'Custom parameters notes', 'Tech notes', 'Other App tracking implemented']);
  const CHECKBOX = new Set(['AM set up in Awin UI']);
  const DATE = new Set(['Pixel Sent', 'Successful Tracking Test']);
  const BASE = ['--None--', 'Yes', 'No', 'Unknown', 'Not Applicable'];

  function makeField(label, value) {
    const type = TEXT.has(label) || DATE.has(label) ? 'text' : CHECKBOX.has(label) ? 'checkbox' : 'select';
    const fromTemplates = (globalThis.TCA_TEMPLATES || []).map(t => t.values[label]).filter(Boolean);
    const options = type === 'select' ? [...new Set([...BASE, ...(value ? [value] : []), ...fromTemplates, 'Other'])] : null;
    return { label, type, options };
  }

  const technical = spec.map(f => makeField(f.label, f.value));
  if (scenario === 'missing-option') technical.find(f => f.label === 'Server to server').options = ['--None--', 'No', 'Exempt'];

  // A second checklist with overlapping labels, to prove nothing outside Technical Checklist is touched.
  const commercial = [makeField('Img tag implemented', 'No'), makeField('Tech notes', null), makeField('Contract signed', null)];

  const sections = [
    { title: 'Commercial Checklist', fields: commercial },
    { title: 'Technical Checklist', fields: technical }
  ];
  if (scenario === 'duplicate') sections.push({ title: 'Technical Checklist', fields: technical.slice(0, 3) });

  // Stored record values (some pre-filled to show overwrite and preservation).
  const record = {
    'Technical Checklist::Server to server': 'No',
    'Technical Checklist::Tech notes': 'Existing note from the implementer',
    'Technical Checklist::AM set up in Awin UI': 'true',
    'Commercial Checklist::Img tag implemented': 'No'
  };
  if (scenario === 'dates-filled') Object.assign(record, { 'Technical Checklist::Pixel Sent': '01/10/2026', 'Technical Checklist::Successful Tracking Test': '20/10/2026' });
  let draft = null;   // non-null while in edit mode
  let saving = false;

  const key = (section, field) => section.title + '::' + field.label;
  function el(tag, props = {}, ...children) {
    const node = Object.assign(document.createElement(tag), props);
    node.append(...children);
    return node;
  }

  // The record's history box, with the line that records when the record was created.
  function history() {
    const rows = [['10/11/2026 15:20', 'Tech notes', 'Example User']];
    if (scenario !== 'no-history') rows.push(['03/11/2026 09:41', 'Created.', 'Example User']);
    return el('section', {}, el('h3', { textContent: 'Implementation History' }),
      el('table', {}, el('tbody', {}, ...rows.map(r => el('tr', {}, ...r.map(c => el('td', { textContent: c })))))));
  }

  function render() {
    const main = document.getElementById('main');
    main.replaceChildren(...sections.map(section => {
      const grid = el('div', { className: 'grid' });
      for (const field of section.fields) {
        const k = key(section, field);
        const row = el('div', { className: 'field-row' }, el('span', { className: 'field-label', textContent: field.label }));
        if (!draft) {
          const shown = field.type === 'checkbox' ? (record[k] === 'true' ? '☑' : '☐') : (record[k] || '');
          row.append(el('span', { className: 'field-value', textContent: shown }),
            el('button', { type: 'button', title: 'Edit ' + field.label, textContent: '✎', onclick: enterEdit }));
        } else {
          let control;
          if (field.type === 'select') {
            control = el('select', {}, ...field.options.map(o => el('option', { value: o === '--None--' ? '' : o, textContent: o })));
            control.value = draft[k] || '';
          } else if (field.type === 'checkbox') {
            control = el('input', { type: 'checkbox', checked: draft[k] === 'true' });
          } else {
            control = el('input', { type: 'text', value: draft[k] || '' });
          }
          control.addEventListener('change', () => { draft[k] = field.type === 'checkbox' ? String(control.checked) : control.value; });
          row.append(control);
        }
        grid.append(row);
      }
      return el('section', {}, el('h3', { textContent: section.title }), grid);
    }), history());

    const footer = document.getElementById('footer');
    footer.replaceChildren(...(draft ? [el('footer', { className: 'edit-bar' },
      el('button', { type: 'button', name: 'CancelEdit', textContent: 'Cancel', onclick: cancel }),
      el('button', { type: 'button', name: 'SaveEdit', textContent: 'Save', onclick: save }))] : []));
  }

  function enterEdit() { draft = { ...record }; document.getElementById('toast').replaceChildren(); render(); }
  function cancel() { draft = null; render(); }
  function save() {
    if (saving) return;
    saving = true;
    setTimeout(() => {
      saving = false;
      if (scenario === 'error') {
        const bar = document.querySelector('footer.edit-bar');
        bar.querySelector('.save-error')?.remove();
        bar.prepend(el('span', { className: 'save-error', textContent: 'We hit a snag. Review the errors on this page.' }));
        return;
      }
      Object.assign(record, draft);
      draft = null;
      render();
      document.getElementById('toast').replaceChildren(el('div', { className: 'toast-success', textContent: 'Implementation "IMP-0001" was saved.' }));
      window.mockSaveCount = (window.mockSaveCount || 0) + 1;
    }, 300);
  }

  window.mockRecord = record;
  // The client's site, in the record header (plain text here, as a typed value).
  if (scenario !== 'no-landing') {
    document.querySelector('header.record').append(el('div', { className: 'field-row' },
      el('span', { className: 'field-label', textContent: 'Landing Page URL' }), el('span', { className: 'field-value', textContent: 'www.example-shop.com' })));
  }
  render();
})();
</script>
</body>
</html>
